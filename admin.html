<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarkari Update Pro - Admin</title><meta name="robots" content="noindex, nofollow, noarchive"><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}.top{background:#092f70;color:#fff;padding:18px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}label{display:block;font-weight:700;font-size:13px;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:8px}textarea{min-height:100px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;background:#0b3d91;color:#fff;margin:5px 3px 0 0}.alt{background:#eaf1ff;color:#0b3d91}.danger{background:#d92d20}.item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#667085;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap"><h2 style="margin:0">Sarkari Update Pro — Admin Panel</h2><div>Jobs, Results, Admit Card, Answer Key और Syllabus manage करें</div></div></div><main class="wrap"><div class="grid"><section class="card"><h3>Add / Edit Content</h3><label>Type</label><select id="type"><option value="job">Latest Job</option><option value="result">Result</option><option value="admit">Admit Card</option><option value="answer">Answer Key</option><option value="syllabus">Syllabus</option><option value="admission">Admission</option></select><label>Title</label><input id="title"><label>Organization / Category</label><input id="org"><label>Post / Exam Name</label><input id="post"><label>Total Vacancy</label><input id="vacancy"><label>Eligibility</label><textarea id="eligibility"></textarea><label>Extra Info</label><input id="extra"><label>Last Date / Update</label><input id="date"><label>Important Dates</label><input id="dates"><label>Application Fee</label><input id="fee"><label>Selection Process</label><input id="selection"><label>Details</label><textarea id="details"></textarea><label>Official URL</label><input id="url" placeholder="https://"><button class="btn" onclick="saveItem()">Save Content</button><button class="btn alt" onclick="clearForm()">Clear</button><button class="btn alt" onclick="exportData()">Export JSON</button></section><section class="card"><h3>Published Content</h3><button class="btn danger" onclick="clearAll()">Delete All</button><div id="list"></div></section></div></main><script>var key='sarkariUpdateProData',data=JSON.parse(localStorage.getItem(key)||'[]'),editId=null;function $(id){return document.getElementById(id)}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function saveItem(){var x={id:editId||Date.now(),type:$('type').value,title:$('title').value.trim(),org:$('org').value.trim(),extra:$('extra').value.trim(),date:$('date').value.trim(),details:$('details').value.trim(),url:$('url').value.trim()};if(!x.title){alert('Title भरें');return}var i=data.findIndex(function(a){return a.id===x.id});if(i>=0)data[i]=x;else data.unshift(x);save();clearForm()}function editItem(id){var x=data.find(function(a){return a.id===id});if(!x)return;editId=id;['type','title','org','extra','date','details','url'].forEach(function(k){$(k).value=x[k]||''});scrollTo(0,0)}function del(id){if(confirm('Delete करें?')){data=data.filter(function(x){return x.id!==id});save()}}function clearForm(){editId=null;['title','org','extra','date','details','url'].forEach(function(k){$(k).value=''});$('type').value='job'}function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){$('list').innerHTML=data.length?data.map(function(x){return '<div class="item"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.type)+' • '+esc(x.org)+' • '+esc(x.date)+'</div><button class="btn alt" onclick="editItem('+x.id+')">Edit</button><button class="btn danger" onclick="del('+x.id+')">Delete</button>'+(x.url?'<a class="btn alt" target="_blank" href="'+esc(x.url)+'">Official Link</a>':'')+'</div>'}).join(''):'<p class="muted">अभी कोई custom content नहीं है।</p>'}function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='sarkari-update-data.json';a.click()}function clearAll(){if(confirm('सारा custom content delete करें?')){data=[];save()}}render();</script></body></html>
